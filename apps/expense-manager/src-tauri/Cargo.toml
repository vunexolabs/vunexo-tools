[package]
name = "expense-manager"
version = "0.1.0"
description = "Vunexo Expense Manager — free, offline-first expense tracking for small businesses"
license = "MIT"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
# `.vex` is a zip archive (database-schema.md §7/§9), same shape as Billing's
# `.vbx`. Only `deflate` is enabled — the other backends would pull C
# toolchains for no benefit on a file that is mostly an already-compact
# SQLite page store plus a handful of receipt images.
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
