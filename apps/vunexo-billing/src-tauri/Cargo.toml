[package]
name = "vunexo-billing"
version = "0.0.0"
description = "Vunexo Billing — free, offline-first invoicing for small businesses"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
# `default-features = false` deliberately drops printpdf's `html` feature and the
# whole azul layout/fontconfig stack with it: this app composes the invoice
# itself (ADR — Round 7, "real layout control, not print the webview"), so the
# only things wanted here are the core PDF operator API, font embedding, and
# PNG/JPEG decoding for the business logo.
printpdf = { version = "0.12", default-features = false, features = ["images", "png", "jpeg", "text_layout"] }
tauri-plugin-dialog = "2"
# `.vbx` is a zip archive (database-schema.md §9). Only `deflate` is enabled —
# the other backends (zstd/bzip2/lzma) would pull C toolchains for no benefit
# on a file that is mostly an already-compact SQLite page store.
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
