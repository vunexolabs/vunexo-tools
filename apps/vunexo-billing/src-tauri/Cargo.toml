[package]
name = "vunexo-billing"
version = "0.0.0"
description = "Vunexo Billing — free, offline-first invoicing for small businesses"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
